services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ride-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ride_share}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgresdb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ride_app
    environment:
      PG_HOST: postgres
      DB_PORT: "5432"
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgresdb}
      DB_NAME: ${DB_NAME:-ride_share}
      SERVICE_MODE: RUN
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  postgres_data: